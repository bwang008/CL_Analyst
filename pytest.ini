[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    sabotage: marks tests for sabotage verification
    xfail_until_implemented: marks tests expected to fail until feature is implemented
addopts = -v --tb=short
